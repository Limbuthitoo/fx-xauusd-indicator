services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

  redis:
    restart: unless-stopped

  api:
    profiles: ["prod"]
    restart: unless-stopped
    command: ["npm", "run", "start"]
    environment:
      NODE_ENV: production
      PYTHON_BIN: /opt/venv/bin/python3
      DATABASE_URL: postgres://orb_user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/orb_guide
      REDIS_URL: redis://redis:6379
      REDIS_REQUIRED: "true"
      API_PORT: 7073
      LOCAL_PIN: ${LOCAL_PIN:?LOCAL_PIN is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?ADMIN_SESSION_SECRET is required}
      ADMIN_TOKEN_TTL_MINUTES: ${ADMIN_TOKEN_TTL_MINUTES:-720}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:?PUBLIC_API_BASE_URL is required}
      PUBLIC_WEB_BASE_URL: ${PUBLIC_WEB_BASE_URL:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      EMBEDDED_MARKET_DATA_WORKER: "false"
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:?TWELVE_DATA_API_KEY is required}
      TWELVE_DATA_SYMBOL: ${TWELVE_DATA_SYMBOL:-XAU/USD}
      TWELVE_DATA_INTERVAL: ${TWELVE_DATA_INTERVAL:-5min}
      TWELVE_DATA_POLL_SECONDS: ${TWELVE_DATA_POLL_SECONDS:-60}
      TWELVE_DATA_CATCHUP_SECONDS: ${TWELVE_DATA_CATCHUP_SECONDS:-1800}
      TWELVE_DATA_DAILY_CREDIT_LIMIT: ${TWELVE_DATA_DAILY_CREDIT_LIMIT:-800}
      TWELVE_DATA_MINUTE_CREDIT_LIMIT: ${TWELVE_DATA_MINUTE_CREDIT_LIMIT:-8}
      TWELVE_DATA_WARN_CREDITS: ${TWELVE_DATA_WARN_CREDITS:-650}
      TWELVE_DATA_DANGER_CREDITS: ${TWELVE_DATA_DANGER_CREDITS:-720}
      TWELVE_DATA_STOP_CREDITS: ${TWELVE_DATA_STOP_CREDITS:-760}
      PUSH_PROVIDER: ${PUSH_PROVIDER:-auto}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      BACKUP_DIR: ${BACKUP_DIR:-backups/postgres}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      SLOW_REQUEST_THRESHOLD_MS: ${SLOW_REQUEST_THRESHOLD_MS:-1500}
      DATABASE_POOL_MAX: ${API_DATABASE_POOL_MAX:-20}
      MARKET_CLOSED_DATES: ${MARKET_CLOSED_DATES:-}
    ports:
      - "127.0.0.1:7073:7073"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:7073/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    profiles: ["prod"]
    restart: unless-stopped
    command: ["npm", "run", "start:worker"]
    environment:
      NODE_ENV: production
      PYTHON_BIN: /opt/venv/bin/python3
      DATABASE_URL: postgres://orb_user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/orb_guide
      REDIS_URL: redis://redis:6379
      REDIS_REQUIRED: "true"
      EMBEDDED_MARKET_DATA_WORKER: "false"
      LOCAL_PIN: ${LOCAL_PIN:?LOCAL_PIN is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?ADMIN_SESSION_SECRET is required}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:?PUBLIC_API_BASE_URL is required}
      PUBLIC_WEB_BASE_URL: ${PUBLIC_WEB_BASE_URL:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      TWELVE_DATA_API_KEY: ${TWELVE_DATA_API_KEY:?TWELVE_DATA_API_KEY is required}
      TWELVE_DATA_SYMBOL: ${TWELVE_DATA_SYMBOL:-XAU/USD}
      TWELVE_DATA_INTERVAL: ${TWELVE_DATA_INTERVAL:-5min}
      TWELVE_DATA_POLL_SECONDS: ${TWELVE_DATA_POLL_SECONDS:-60}
      TWELVE_DATA_CATCHUP_SECONDS: ${TWELVE_DATA_CATCHUP_SECONDS:-1800}
      TWELVE_DATA_DAILY_CREDIT_LIMIT: ${TWELVE_DATA_DAILY_CREDIT_LIMIT:-800}
      TWELVE_DATA_MINUTE_CREDIT_LIMIT: ${TWELVE_DATA_MINUTE_CREDIT_LIMIT:-8}
      TWELVE_DATA_WARN_CREDITS: ${TWELVE_DATA_WARN_CREDITS:-650}
      TWELVE_DATA_DANGER_CREDITS: ${TWELVE_DATA_DANGER_CREDITS:-720}
      TWELVE_DATA_STOP_CREDITS: ${TWELVE_DATA_STOP_CREDITS:-760}
      PUSH_PROVIDER: ${PUSH_PROVIDER:-auto}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      BACKUP_DIR: ${BACKUP_DIR:-backups/postgres}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      SLOW_REQUEST_THRESHOLD_MS: ${SLOW_REQUEST_THRESHOLD_MS:-1500}
      DATABASE_POOL_MAX: ${WORKER_DATABASE_POOL_MAX:-8}
      MARKET_CLOSED_DATES: ${MARKET_CLOSED_DATES:-}
    healthcheck:
      test: ["CMD-SHELL", "/opt/venv/bin/python3 -c 'import psycopg' && node -e \"const pg=require('pg'); const c=new pg.Client({connectionString:process.env.DATABASE_URL}); c.connect().then(()=>c.query(\\\"SELECT heartbeat_at FROM worker_heartbeats WHERE worker_name='market-data-worker' AND heartbeat_at > now() - interval '2 minutes' LIMIT 1\\\")).then(r=>{c.end();process.exit(r.rowCount?0:1)}).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 8s
      retries: 5

  quant:
    profiles: ["prod"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://orb_user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/orb_guide
    ports:
      - "127.0.0.1:${QUANT_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  backup:
    image: postgres:16-alpine
    profiles: ["prod"]
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
    command:
      - sh
      - -lc
      - |
        set -e
        mkdir -p /backups/postgres
        while true; do
          ts=$$(date -u +%Y%m%dT%H%M%SZ)
          file="/backups/postgres/orb_guide_$${ts}.dump"
          pg_dump -h postgres -U orb_user -d orb_guide -Fc > "$${file}"
          find /backups/postgres -type f -name 'orb_guide_*.dump' -mtime +"$${BACKUP_RETENTION_DAYS}" -print -delete
          echo "backup created: $${file}"
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
    depends_on:
      postgres:
        condition: service_healthy

  ops-monitor:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ["prod"]
    restart: unless-stopped
    command: ["node", "/app/scripts/ops-monitor.mjs"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://orb_user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/orb_guide
      REDIS_URL: redis://redis:6379
      API_HEALTH_URL: http://api:7073/api/health
      QUANT_HEALTH_URL: http://quant:8000/health
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-60}
      MONITOR_WORKER_MAX_AGE_SECONDS: ${MONITOR_WORKER_MAX_AGE_SECONDS:-180}
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
      redis:
        condition: service_healthy
      quant:
        condition: service_healthy

  web:
    profiles: ["prod"]
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL:?PUBLIC_API_BASE_URL is required}
    environment:
      NODE_ENV: production
      VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL:?PUBLIC_API_BASE_URL is required}
      EXPO_PUBLIC_API_BASE_URL: ${EXPO_PUBLIC_API_BASE_URL:-}
      EXPO_PUBLIC_EAS_PROJECT_ID: ${EXPO_PUBLIC_EAS_PROJECT_ID:-}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ["prod-tools"]
    command: ["npm", "run", "db:migrate"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://orb_user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/orb_guide
      REDIS_URL: redis://redis:6379
      DATABASE_MIGRATION_BASELINE: ${DATABASE_MIGRATION_BASELINE:-}
    depends_on:
      postgres:
        condition: service_healthy
